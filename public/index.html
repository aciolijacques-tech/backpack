<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Backpack</title>
<link rel="stylesheet" href="/style.css">
<link rel="manifest" href="/manifest.json">
<link rel="icon" type="image/png" href="/icon-192.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="theme-color" content="#cfc6bc">
<meta name="apple-mobile-web-app-title" content="Backpack">
</head>
<body>
  <div class="ambiente" aria-hidden="true"></div>

  <!-- barra flutuante do topo -->
  <header class="topo vidro-escuro">
    <img class="topo-logo" src="/icon-192.png" alt="Backpack">
    <div class="topo-nav"><button class="btn-icone" id="navVolta" title="Voltar (⌘[)" aria-label="Voltar"><svg class="ico" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg></button><button class="btn-icone" id="navAvanca" title="Avançar (⌘])" aria-label="Avançar"><svg class="ico" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18l6-6-6-6"/></svg></button></div>
    <button class="topo-busca" id="btnBusca" title="Buscar em tudo (⌘K)">
      <svg class="ico" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <span>Buscar em tudo…</span><kbd>⌘K</kbd>
    </button>
    <button class="fita-atualizacao" id="fitaAtualizacao" hidden><b></b></button>
    <button class="topo-foco" id="foco" title="Modo foco (F)">
      <svg class="ico" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2.5M9 2h6"/></svg>
      <span id="focoT">Foco</span>
    </button>
    <div class="hud" id="hud" role="button" tabindex="0" title="Conquistas"></div>
    <button id="btnVoz" class="btn-icone topo-voz" title="Criar por voz (V)" aria-label="Criar por voz"><svg class="ico" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0014 0M12 18v3"/></svg></button>
    <button id="btnNovo" class="btn-redondo" title="Novo item (N)">
      <svg class="ico" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
    </button>
  </header>

  <div class="palco">
    <nav id="trilho" class="trilho vidro-escuro" aria-label="Páginas"></nav>
    <main class="janela vidro" id="vista"></main>
  </div>

  <div id="sobreposicao" class="sobreposicao" hidden></div>
  <div id="menu" class="menu vidro-escuro" hidden></div>
  <div id="toasts" class="toasts" aria-live="polite"></div>
  <div id="nivel-novo" class="nivel-novo" hidden></div>
  <div id="soltarAqui" class="soltar-tela" hidden><div class="vidro">Solte para guardar no Backpack</div></div>
  <canvas id="confete" class="confete" aria-hidden="true"></canvas>

  <script src="/icones.js"></script>
  <script src="/core.js"></script>
  <script src="/efeitos.js"></script>
  <script src="/fundo.js"></script>
  <script src="/jogo.js"></script>
  <script src="/tour.js"></script>
  <script src="/voz.js"></script>
  <script src="/qr.js"></script>
  <script src="/tarefas.js"></script>
  <script src="/rotina.js"></script>
  <script src="/clientes.js"></script>
  <script src="/financeiro.js"></script>
  <script src="/biblioteca.js"></script>
  <script src="/item.js"></script>
  <script src="/leitor.js"></script>
  <script src="/mapa.js"></script>
  <script src="/ia.js"></script>
  <script src="/integra.js"></script>
  <script src="/foco.js"></script>
  <script src="/busca.js"></script>
  <script src="/atualiza.js"></script>
  <script src="/inicio.js"></script>
  <script src="/extras.js"></script>
  <script src="/paginas.js"></script>
  <script src="/main.js"></script>
</body>
</html>
